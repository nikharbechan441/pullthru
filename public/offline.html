<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PullThru — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #FAF8F5;
      color: #0F172A;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 380px;
      width: 100%;
      background: #FFFFFF;
      border: 1px solid #E6E2D8;
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
    }
    .badge {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: #007749;
      color: #FFFFFF;
      font-weight: 900;
      font-size: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      line-height: 1.5;
      color: #475569;
      margin-bottom: 20px;
    }
    button {
      width: 100%;
      background: #007749;
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      padding: 14px 20px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">PT</div>
    <h1>No Signal / Load-Shedding</h1>
    <p>We couldn't reach PullThru right now. Check your mobile data or Wi-Fi connection and tap below to reconnect.</p>
    <button onclick="window.location.href='https://pullthru.co.za'">Retry Connection</button>
  </div>
</body>
</html>
