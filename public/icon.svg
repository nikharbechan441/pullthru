<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- 3D Squircle Surface Gradient -->
    <linearGradient id="ptBg" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#009B5E" />
      <stop offset="45%" stop-color="#007749" />
      <stop offset="100%" stop-color="#004227" />
    </linearGradient>

    <!-- Center Radial Spotlight for 3D Depth -->
    <radialGradient id="ptCenterGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#00B870" stop-opacity="0.42" />
      <stop offset="65%" stop-color="#007749" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#002E1B" stop-opacity="0" />
    </radialGradient>

    <!-- Top Edge 3D Bevel Highlight -->
    <linearGradient id="topBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="12%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="88%" stop-color="#000000" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#001F12" stop-opacity="0.55" />
    </linearGradient>

    <!-- 3D Porcelain White Face Gradient for PT -->
    <linearGradient id="ptFaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="75%" stop-color="#F4F9F6" />
      <stop offset="100%" stop-color="#DDF0E6" />
    </linearGradient>

    <!-- 3D Gold Extruded Dot Gradient -->
    <linearGradient id="goldFaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="55%" stop-color="#FFB81C" />
      <stop offset="100%" stop-color="#E59800" />
    </linearGradient>

    <!-- Soft Ambient 3D Drop Shadow -->
    <filter id="ptShadow3D" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#001F12" flood-opacity="0.48" />
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#002918" flood-opacity="0.3" />
    </filter>

    <filter id="barShadow3D" x="-15%" y="-30%" width="130%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#002214" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base 3D Cushion Container -->
  <rect width="512" height="512" rx="116" fill="url(#ptBg)" />
  <rect width="512" height="512" rx="116" fill="url(#ptCenterGlow)" />

  <!-- Outer 3D Rim Bevel -->
  <rect x="2.5" y="2.5" width="507" height="507" rx="113.5" fill="none" stroke="url(#topBevel)" stroke-width="5" />

  <!-- 6-Color SA Flag Bar with 3D Pill Bevel -->
  <g filter="url(#barShadow3D)">
    <!-- 3D Lower Lip of Flag Pills -->
    <rect x="76" y="105" width="60" height="13" rx="6.5" fill="#9E2118" />
    <rect x="142" y="105" width="30" height="13" rx="6.5" fill="#CBD5E1" />
    <rect x="178" y="105" width="110" height="13" rx="6.5" fill="#C48200" />
    <rect x="294" y="105" width="44" height="13" rx="6.5" fill="#020617" />
    <rect x="344" y="105" width="92" height="13" rx="6.5" fill="#000B52" />

    <!-- Main Flag Pills -->
    <rect x="76" y="101" width="60" height="13" rx="6.5" fill="#E03C31" />
    <rect x="142" y="101" width="30" height="13" rx="6.5" fill="#FFFFFF" />
    <rect x="178" y="101" width="110" height="13" rx="6.5" fill="#FFB81C" />
    <rect x="294" y="101" width="44" height="13" rx="6.5" fill="#0F172A" />
    <rect x="344" y="101" width="92" height="13" rx="6.5" fill="#001489" />

    <!-- Top Specular Highlight on Flag Pills -->
    <rect x="80" y="102.5" width="52" height="2.5" rx="1.25" fill="#FFFFFF" opacity="0.35" />
    <rect x="182" y="102.5" width="102" height="2.5" rx="1.25" fill="#FFFFFF" opacity="0.4" />
    <rect x="348" y="102.5" width="84" height="2.5" rx="1.25" fill="#FFFFFF" opacity="0.28" />
  </g>

  <!-- 3D Extruded PT. Monogram (Seamless 1px Solid Extrusion) -->
  <g filter="url(#ptShadow3D)">
    <!-- Solid Seamless 3D Side Wall for PT -->
    <text x="240.5" y="367" text-anchor="middle" fill="#52826B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="216" font-weight="900" letter-spacing="-6">PT</text>
    <text x="240" y="366" text-anchor="middle" fill="#5D8E77" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="216" font-weight="900" letter-spacing="-6">PT</text>
    <text x="239.5" y="365" text-anchor="middle" fill="#699B83" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="216" font-weight="900" letter-spacing="-6">PT</text>
    <text x="239" y="364" text-anchor="middle" fill="#77A991" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="216" font-weight="900" letter-spacing="-6">PT</text>
    <text x="238.5" y="363" text-anchor="middle" fill="#86B79F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="216" font-weight="900" letter-spacing="-6">PT</text>
    <text x="238" y="362" text-anchor="middle" fill="#96C5AE" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="216" font-weight="900" letter-spacing="-6">PT</text>
    <text x="237.5" y="360.5" text-anchor="middle" fill="#A9D4BF" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="216" font-weight="900" letter-spacing="-6">PT</text>

    <!-- Crisp Front 3D Face -->
    <text x="237" y="359" text-anchor="middle" fill="url(#ptFaceGrad)" stroke="#FFFFFF" stroke-width="1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="216" font-weight="900" letter-spacing="-6">PT</text>

    <!-- Solid Seamless 3D Extruded Gold Period Dot -->
    <circle cx="410.5" cy="349" r="24" fill="#9E6200" />
    <circle cx="410" cy="347.5" r="24" fill="#AD6D00" />
    <circle cx="409.5" cy="346" r="24" fill="#BC7800" />
    <circle cx="409" cy="344.5" r="24" fill="#CC8300" />
    <circle cx="408" cy="343" r="24" fill="#DC8F00" />
    <circle cx="407" cy="341" r="24" fill="url(#goldFaceGrad)" stroke="#FFE885" stroke-width="1" />
  </g>
</svg>